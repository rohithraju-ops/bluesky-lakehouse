# docker-compose.yml
services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --smp=1
      - --memory=1G
      - --mode=dev-container
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/lakehouse &&
      mc ls local/ &&
      echo 'bucket lakehouse ready'
      "

  risingwave:
    image: risingwavelabs/risingwave:latest
    container_name: risingwave
    command: ["playground"]
    ports:
      - "4566:4566"
      - "5691:5691"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4566'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Postgres backing store for Polaris (separate from any other postgres)
  polaris-postgres:
    image: postgres:16
    container_name: polaris-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
    volumes:
      - polaris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d POLARIS"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: bootstrap the POLARIS realm and create root principal credentials.
  # Runs once, exits 0, then the polaris server depends on its successful exit.
  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    container_name: polaris-bootstrap
    depends_on:
      polaris-postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      polaris.persistence.type: relational-jdbc
    command: ["bootstrap", "-r", "POLARIS", "-c", "POLARIS,root,s3cr3t"]
    restart: "no"

  polaris:
    image: apache/polaris:latest
    container_name: polaris
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      polaris.persistence.type: relational-jdbc
      polaris.realm-context.realms: POLARIS
      polaris.realm-context.default-realm: POLARIS
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
    ports:
      - "8181:8181"   # REST catalog API + management API
      - "8182:8182"   # Quarkus management (health, metrics)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8182/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  minio-data:
  polaris-postgres-data: