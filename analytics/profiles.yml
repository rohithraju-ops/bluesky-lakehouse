# analytics/profiles.yml
bluesky_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'analytics.duckdb'
      extensions:
        - httpfs
        - iceberg
      settings:
        s3_region: 'us-east-1'
        s3_access_key_id: 'minio'
        s3_secret_access_key: 'minio123'
        s3_endpoint: 'localhost:9000'
        s3_use_ssl: false
        s3_url_style: 'path'
        # Allow DuckDB to find the latest Iceberg metadata without an explicit
        # version hint. Safe for read-only analytics against our own tables.
        unsafe_enable_version_guessing: true
